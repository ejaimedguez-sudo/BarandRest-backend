[barandrest]
yourserver.example.com ansible_user=deploy ansible_port=22

[barandrest:vars]
# Ruta donde se desplegará la aplicación
deploy_path=/var/www/barandrest
# Ruta a la clave privada que usarás desde el controlador Ansible local
ansible_ssh_private_key_file={{ playbook_dir }}/../deploy/keys/deploy_key

# Clave pública generada (añadela al servidor en ~/.ssh/authorized_keys)
# Public key (deploy/keys/deploy_key.pub):
# ssh-rsa  barandrest-deploy-key