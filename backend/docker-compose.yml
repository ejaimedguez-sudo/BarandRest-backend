version: '3.8'
services:
  app:
    image: php:8.2-fpm
    container_name: barandrest_app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html:cached
    networks:
      - appnet

  web:
    image: nginx:stable-alpine
    container_name: barandrest_web
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - appnet

  db:
    image: mysql:8.0
    container_name: barandrest_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: barandrest
    ports:
      - "33060:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - appnet

networks:
  appnet:
    driver: bridge

volumes:
  db_data:
