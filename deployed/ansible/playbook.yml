---
- name: Deploy BarAndRest backend from zip
  hosts: barandrest
  become: true
  vars:
    release_zip: /tmp/backend_release_clean.zip
    deploy_path: /var/www/barandrest
  tasks:
    - name: Ensure deploy path exists
      file:
        path: "{{ deploy_path }}"
        state: directory
        owner: www-data
        group: www-data

    - name: Upload release zip
      copy:
        src: "{{ release_zip }}"
        dest: /tmp/backend_release_clean.zip
      delegate_to: localhost
      when: false

    - name: Unarchive release
      unarchive:
        src: /tmp/backend_release_clean.zip
        dest: "{{ deploy_path }}"
        remote_src: yes

    - name: Install PHP deps
      shell: |
        cd {{ deploy_path }} && composer install --no-dev --optimize-autoloader
      args:
        chdir: "{{ deploy_path }}"

    - name: Ensure .env exists
      copy:
        src: "{{ deploy_path }}/.env.example"
        dest: "{{ deploy_path }}/.env"
        remote_src: yes
        force: no

    - name: Run migrations and seed
      shell: |
        cd {{ deploy_path }} && php artisan key:generate --force && php artisan migrate --force && php artisan db:seed --force

    - name: Ensure storage link
      shell: php artisan storage:link || true
      args:
        chdir: "{{ deploy_path }}"

    - name: Install system packages for runtime
      apt:
        name:
          - nginx
          - php-cli
          - php-fpm
          - php-xml
          - php-mbstring
          - php-curl
          - php-zip
          - unzip
          - certbot
          - python3-certbot-nginx
        state: present
        update_cache: yes

    - name: Create www-data owner for deploy path
      file:
        path: "{{ deploy_path }}"
        owner: www-data
        group: www-data
        recurse: yes

    - name: Copy systemd units from release if present
      copy:
        src: "{{ deploy_path }}/laravel-worker.service"
        dest: /etc/systemd/system/laravel-worker.service
        owner: root
        group: root
        mode: '0644'
      ignore_errors: yes

    - name: Copy scheduler unit
      copy:
        src: "{{ deploy_path }}/laravel-scheduler.service"
        dest: /etc/systemd/system/laravel-scheduler.service
        owner: root
        group: root
        mode: '0644'
      ignore_errors: yes

    - name: Copy scheduler timer
      copy:
        src: "{{ deploy_path }}/laravel-scheduler.timer"
        dest: /etc/systemd/system/laravel-scheduler.timer
        owner: root
        group: root
        mode: '0644'
      ignore_errors: yes

    - name: Reload systemd and enable services
      systemd:
        daemon_reload: yes
        name: laravel-worker.service
        enabled: yes
        state: restarted
      ignore_errors: yes

    - name: Enable scheduler timer
      systemd:
        name: laravel-scheduler.timer
        enabled: yes
        state: started
      ignore_errors: yes

    - name: Set APP_URL if provided
      lineinfile:
        path: "{{ deploy_path }}/.env"
        regexp: '^APP_URL='
        line: "APP_URL={{ app_url | default('http://127.0.0.1') }}"
      when: app_url is defined

    - name: Obtain TLS with Certbot (nginx) when domain provided
      become: true
      shell: |
        certbot --nginx -n --agree-tos --redirect -m {{ certbot_email }} -d {{ app_domain }}
      when: app_domain is defined and app_domain != ''

    - name: Create daily DB backup cron
      cron:
        name: "barandrest-db-daily"
        minute: 30
        hour: 2
        user: root
        job: "/usr/bin/mysqldump -u {{ db_user | default('root') }} -p'{{ db_password | default('') }}' {{ db_name | default('barandrest') }} > /var/backups/barandrest_$(date +\%F).sql"
      ignore_errors: yes

    - name: Create cert renewal cron (twice daily)
      cron:
        name: "certbot-renew"
        minute: 15
        hour: "*/12"
        user: root
        job: "/usr/bin/certbot renew --quiet"
      when: app_domain is defined and app_domain != ''
      ignore_errors: yes

    - name: Ensure healthcheck script exists
      copy:
        src: "{{ deploy_path }}/check_health.sh"
        dest: /usr/local/bin/barandrest_healthcheck.sh
        owner: root
        group: root
        mode: '0755'
      ignore_errors: yes

    - name: Create simple systemd service for healthcheck
      copy:
        content: |
          [Unit]
          Description=BarAndRest Healthcheck
          After=network.target

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/barandrest_healthcheck.sh

          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/barandrest-healthcheck.service
        mode: '0644'
      ignore_errors: yes

    - name: Enable healthcheck timer (runs every 5 minutes)
      copy:
        content: |
          [Unit]
          Description=Run BarAndRest healthcheck every 5 minutes

          [Timer]
          OnBootSec=1min
          OnUnitActiveSec=5min

          [Install]
          WantedBy=timers.target
        dest: /etc/systemd/system/barandrest-healthcheck.timer
        mode: '0644'
      ignore_errors: yes

    - name: Start healthcheck timer
      systemd:
        name: barandrest-healthcheck.timer
        enabled: yes
        state: started
      ignore_errors: yes
