version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: docker/local.Dockerfile
    volumes:
      - ./:/var/www/html:cached
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
    depends_on:
      - db

  mailhog:
    image: mailhog/mailhog
    ports:
      - "8025:8025"
    networks:
      - appnet

  queue:
    image: php:8.2-cli
    volumes:
      - ./:/var/www/html:cached
    working_dir: /var/www/html
    command: bash -c "composer install && php artisan queue:work --sleep=3 --tries=3 --timeout=90"
    depends_on:
      - db
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
